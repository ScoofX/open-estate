<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Estate</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c30; --panel2:#1a2540; --line:#2a3858; --txt:#e8edf7; --mut:#8b99b8;
  --gold:#e6b84a; --good:#2ecc71; --bad:#e74c3c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
button.danger{background:#3a1519;border-color:#7a2a31}
input,select{font:inherit;background:#0e1628;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
h1{margin:0;letter-spacing:.04em}
.hidden{display:none!important}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(420px,100%)}
.card h1{color:var(--gold);font-size:30px;margin-bottom:4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.row{display:flex;gap:8px;margin-top:10px}
.sep{height:1px;background:var(--line);margin:18px 0}
.err{color:#ff8c8c;font-size:14px;min-height:18px;margin-top:8px}
.plist div{display:flex;align-items:center;gap:8px;padding:6px 0}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;border:2px solid rgba(255,255,255,.35)}
.code{font-size:34px;letter-spacing:.2em;color:var(--gold);font-weight:800}

/* game */
#game{display:flex;gap:14px;padding:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#boardwrap{flex:none}
#board{display:grid;grid-template-columns:1.45fr repeat(9,1fr) 1.45fr;grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;
  background:#0f3a2e;border:3px solid #0a281f;border-radius:10px;overflow:hidden;position:relative}
.sq{border:1px solid #0a281f;background:#cfe9d8;color:#0b1a14;position:relative;display:flex;flex-direction:column;overflow:hidden;font-size:calc(var(--u)*1.55)}
.sq .band{height:22%;flex:none;position:relative}
.sq .nm{font-weight:700;line-height:1.05;padding:2px 3px 0;text-align:center;flex:1;display:flex;align-items:center;justify-content:center}
.sq .pr{font-size:.85em;text-align:center;padding-bottom:2px;opacity:.8}
.sq.special{background:#e1efe6}
.sq .ico{font-size:2.2em;text-align:center;line-height:1}
.sq .own{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*1.2);}
.sq.mort{filter:grayscale(.9) brightness(.8)}
.sq .mtag{position:absolute;top:24%;right:1px;font-size:.8em;font-weight:900;color:#900}
.sq .houses{position:absolute;inset:0 0 auto 0;height:100%;display:flex;gap:1px;align-items:center;justify-content:center}
.house{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);background:#27ae60;border:1px solid #0b3d20;border-radius:2px}
.hotel{width:calc(var(--u)*3);height:calc(var(--u)*1.6);background:#d63031;border:1px solid #5a0f10;border-radius:2px}
.toks{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.2);display:flex;flex-wrap:wrap;gap:1px;justify-content:center;padding:1px}
.tok{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:calc(var(--u)*1.8);box-shadow:0 1px 3px #0008;transition:transform .2s}
.tok.turn{transform:scale(1.25);box-shadow:0 0 0 2px var(--gold),0 1px 4px #000a;z-index:2}
#center{grid-row:2/11;grid-column:2/11;background:radial-gradient(circle at 50% 40%,#14503f,#0d2f26);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);padding:calc(var(--u)*2);text-align:center}
#center .title{font-size:calc(var(--u)*4);font-weight:900;letter-spacing:.12em;color:var(--gold)}
#turnline{font-size:calc(var(--u)*2.4);font-weight:700}
#dice{display:flex;gap:calc(var(--u)*1.6)}
.die{width:calc(var(--u)*7);height:calc(var(--u)*7);background:#fff;border-radius:calc(var(--u)*1);color:#111;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--u)*.9);box-shadow:0 3px 8px #0009}
.die i{display:block;width:70%;height:70%;border-radius:50%;margin:auto}
.die i.on{background:#111}
.die.roll{animation:shake .5s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-18deg) scale(1.1)}50%{transform:rotate(14deg)}75%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
#acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#acts button{font-size:calc(var(--u)*2.1);padding:calc(var(--u)*1.2) calc(var(--u)*2.2)}
#cardnote{font-size:calc(var(--u)*1.9);background:#00000055;border-radius:8px;padding:calc(var(--u)*1) calc(var(--u)*1.6);max-width:90%}
#side{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.pl.turn{background:#22305a;outline:1px solid var(--gold)}
.pl .nm{flex:1;font-weight:600}
.pl .mn{font-variant-numeric:tabular-nums;font-weight:700}
.pl.out{opacity:.4;text-decoration:line-through}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:#2a3858;color:var(--mut);margin-left:4px}
.prop{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #1d2a47;font-size:14px}
.prop:last-child{border:0}
.prop .sw{width:10px;height:22px;border-radius:3px;flex:none}
.prop .pn{flex:1}
.prop .pn small{color:var(--mut)}
.prop button{padding:3px 8px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{padding:5px 10px;font-size:13px}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
#logbox{height:230px;overflow:auto;font-size:13px;line-height:1.45}
#logbox div{padding:2px 0;border-bottom:1px solid #18233d}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 4px;text-align:left}
th{color:var(--mut);font-weight:600}
.fair{font-size:12px;color:var(--mut);margin-bottom:6px;line-height:1.4}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .card{width:min(560px,100%);max-height:92vh;overflow:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;padding:3px 0}
.chk input{width:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3a1519;border:1px solid #7a2a31;padding:10px 16px;border-radius:10px;z-index:60}
.banner{position:fixed;top:0;left:0;right:0;background:#7a5a10;text-align:center;padding:6px;font-size:14px;z-index:70}
@media(max-width:820px){#side{width:100%}}
</style>
</head>
<body>

<div id="conn" class="banner hidden">Reconnecting...</div>

<div id="home" class="center-screen">
  <div class="card">
    <h1>OPEN ESTATE</h1>
    <div class="sub">Property trading with friends. Dice are rolled by the server with a cryptographic random generator, and every roll is public in the log.</div>
    <label class="sub">Your name</label>
    <input id="nameIn" maxlength="16" placeholder="Mohamed">
    <div class="row"><button class="primary" id="createBtn" style="flex:1">Create a room</button></div>
    <div class="sep"></div>
    <label class="sub">Or join with a room code</label>
    <div class="row"><input id="codeIn" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"><button id="joinBtn">Join</button></div>
    <div class="err" id="homeErr"></div>
  </div>
</div>

<div id="lobby" class="center-screen hidden">
  <div class="card">
    <div class="sub">Room code</div>
    <div class="code" id="lobbyCode"></div>
    <div class="sub" style="margin-top:6px">Share this link with your friends:</div>
    <div class="row"><input id="linkIn" readonly><button id="copyBtn">Copy</button></div>
    <div class="sep"></div>
    <div class="plist" id="lobbyPlayers"></div>
    <div class="row">
      <button class="primary" id="startBtn" style="flex:1">Start game</button>
      <button id="leaveBtn">Leave</button>
    </div>
    <div class="err" id="lobbyErr"></div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="boardwrap"><div id="board"></div></div>
  <div id="side">
    <div class="box"><h3>Players</h3><div id="players"></div></div>
    <div class="box"><h3>Your properties</h3><div id="myprops"></div>
      <div class="row"><button id="tradeBtn" style="flex:1">Propose a trade</button></div>
    </div>
    <div class="box">
      <div class="tabs"><button data-tab="ev" class="on">Events</button><button data-tab="rl">Roll log</button><button data-tab="ch">Chat</button></div>
      <div id="logbox"></div>
      <div class="row hidden" id="chatRow"><input id="chatIn" maxlength="200" placeholder="Message..."><button id="chatBtn">Send</button></div>
    </div>
  </div>
</div>

<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const GCOL = { Egypt: '#8b5a2b', Morocco: '#7ec8e3', 'Saudi Arabia': '#e75fa5', Turkey: '#f39c12', Spain: '#e74c3c', Italy: '#f1d800', France: '#27ae60', UK: '#2c5fd8' };
const token = localStorage.oe_token || (localStorage.oe_token = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)));
let session = null; try { session = JSON.parse(localStorage.oe_session || 'null'); } catch {}
let ws, BOARD = null, S = null, ME = null, tab = 'ev', boardBuilt = false, lastDiceKey = '', modalKey = '';

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2600); }

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    $('conn').classList.add('hidden');
    if (session) send({ t: 'join', code: session.code, name: session.name, token });
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'board') { BOARD = m.board; }
    else if (m.t === 'state') { S = m.s; ME = m.me; session = { code: S.code, name: (S.players.find((p) => p.id === ME) || {}).name || '' }; localStorage.oe_session = JSON.stringify(session); render(); }
    else if (m.t === 'err') { toast(m.msg); $('homeErr').textContent = m.msg; $('lobbyErr').textContent = m.msg; }
    else if (m.t === 'gone') { S = null; ME = null; session = null; localStorage.removeItem('oe_session'); history.replaceState(null, '', location.pathname); render(); }
  };
  ws.onclose = () => { $('conn').classList.remove('hidden'); setTimeout(connect, 1500); };
}

/* ---------- Home / lobby ---------- */
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('codeIn').value = urlRoom.toUpperCase();
$('nameIn').value = localStorage.oe_name || '';
function nm() { const v = $('nameIn').value.trim() || 'Player'; localStorage.oe_name = v; return v; }
$('createBtn').onclick = () => { session = null; send({ t: 'create', name: nm(), token }); };
$('joinBtn').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (c.length < 4) return $('homeErr').textContent = 'Enter the 4-letter code'; send({ t: 'join', code: c, name: nm(), token }); };
$('startBtn').onclick = () => send({ t: 'start' });
$('leaveBtn').onclick = () => send({ t: 'leave' });
$('copyBtn').onclick = () => { $('linkIn').select(); try { navigator.clipboard.writeText($('linkIn').value); } catch { document.execCommand('copy'); } toast('Link copied'); };

/* ---------- Board ---------- */
function pos(i) {
  if (i <= 10) return [11, 11 - i];
  if (i <= 19) return [21 - i, 1];
  if (i <= 30) return [1, i - 19];
  return [i - 29, 11];
}
function buildBoard() {
  const b = $('board'); b.innerHTML = '';
  BOARD.forEach((sq, i) => {
    const [r, c] = pos(i);
    const d = document.createElement('div');
    d.className = 'sq' + (sq.price ? '' : ' special'); d.id = 'sq' + i;
    d.style.gridRow = r; d.style.gridColumn = c;
    let inner = '';
    const ico = { go: 'GO &rarr;', jail: 'JAIL', free: 'P', gotojail: 'GO TO JAIL', chance: '?', chest: '&#127873;', tax: '&#128184;' }[sq.type];
    if (sq.type === 'city') inner = `<div class="band" style="background:${GCOL[sq.group]}"><div class="houses"></div></div><div class="nm">${esc(sq.name)}</div><div class="pr">$${sq.price}</div>`;
    else if (sq.type === 'air') inner = `<div class="ico">&#9992;</div><div class="nm">${esc(sq.name)}</div><div class="pr">$${sq.price}</div>`;
    else if (sq.type === 'util') inner = `<div class="ico">${sq.icon === 'bolt' ? '&#9889;' : '&#128167;'}</div><div class="nm">${esc(sq.name)}</div><div class="pr">$${sq.price}</div>`;
    else inner = `<div class="nm">${ico}${sq.type === 'tax' ? '<br>' + esc(sq.name) + '<br>$' + sq.amount : sq.type === 'chance' || sq.type === 'chest' ? '<br>' + esc(sq.name) : ''}</div>`;
    d.innerHTML = inner + '<div class="own"></div><div class="mtag hidden">M</div><div class="toks"></div>';
    b.appendChild(d);
  });
  const c = document.createElement('div'); c.id = 'center';
  c.innerHTML = '<div class="title">OPEN ESTATE</div><div id="turnline"></div><div id="dice"></div><div id="acts"></div><div id="cardnote" class="hidden"></div>';
  b.appendChild(c);
  boardBuilt = true;
}
function sizeBoard() {
  const w = $('game').clientWidth;
  let size = Math.min(window.innerHeight - 24, w - 24, 820);
  if (w < 900) size = Math.min(w - 20, window.innerHeight - 24, 820);
  if (window.innerWidth > 1000) size = Math.min(window.innerHeight - 24, window.innerWidth - 430, 820);
  size = Math.max(300, size);
  const b = $('board'); b.style.width = size + 'px'; b.style.height = size + 'px'; b.style.setProperty('--u', (size / 100) + 'px');
}
window.addEventListener('resize', () => { if (boardBuilt) sizeBoard(); });

function dieHTML(n) {
  const on = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[n] || [];
  let s = ''; for (let i = 0; i < 9; i++) s += `<i class="${on.includes(i) ? 'on' : ''}"></i>`;
  return s;
}
const P = (id) => S.players.find((p) => p.id === id);
const money = (n) => '$' + n;

function updateBoard() {
  const g = S.g;
  BOARD.forEach((sq, i) => {
    const el = $('sq' + i);
    const toks = el.querySelector('.toks'); toks.innerHTML = '';
    S.players.filter((p) => !p.bankrupt && p.pos === i).forEach((p) => {
      const t = document.createElement('div'); t.className = 'tok' + (g.turn === p.id ? ' turn' : ''); t.style.background = p.color; t.textContent = p.name[0].toUpperCase(); t.title = p.name; toks.appendChild(t);
    });
    if (g.props[i]) {
      const pr = g.props[i]; const own = el.querySelector('.own');
      own.style.background = pr.owner ? P(pr.owner).color : 'transparent';
      el.classList.toggle('mort', pr.mort);
      el.querySelector('.mtag').classList.toggle('hidden', !pr.mort);
      const h = el.querySelector('.houses');
      if (h) h.innerHTML = pr.houses === 5 ? '<div class="hotel"></div>' : '<div class="house"></div>'.repeat(pr.houses);
    }
  });
  // center
  const cur = P(g.turn);
  const dice = $('dice'); const key = g.dice.join('-') + ':' + S.g.stats.total;
  dice.innerHTML = g.stats.total ? `<div class="die">${dieHTML(g.dice[0])}</div><div class="die">${dieHTML(g.dice[1])}</div>` : '';
  if (key !== lastDiceKey && g.stats.total) { dice.querySelectorAll('.die').forEach((d) => d.classList.add('roll')); }
  lastDiceKey = key;
  const tl = $('turnline');
  if (g.winner) tl.innerHTML = `&#127942; ${esc(P(g.winner).name)} wins!`;
  else tl.innerHTML = g.turn === ME ? 'Your turn' : `${esc(cur.name)}'s turn`;
  const acts = $('acts'); acts.innerHTML = '';
  const add = (label, msg, cls, dis) => { const b = document.createElement('button'); b.innerHTML = label; if (cls) b.className = cls; if (dis) b.disabled = true; b.onclick = () => send(msg); acts.appendChild(b); };
  const me = P(ME);
  if (!g.winner && g.turn === ME && !me.bankrupt) {
    if (g.phase === 'roll') {
      add('&#127922; Roll dice', { t: 'roll' }, 'primary');
      if (me.inJail) add('Pay $50 to leave', { t: 'payjail' }, '', me.money < 50);
    } else if (g.phase === 'buy') {
      const sq = BOARD[g.pending];
      add(`Buy ${esc(sq.name)} ${money(sq.price)}`, { t: 'buy' }, 'primary', me.money < sq.price);
      add('Pass', { t: 'decline' });
    } else if (g.phase === 'post') {
      add('End turn', { t: 'end' }, 'primary', me.money < 0);
    }
    if (me.money < 0) add('Declare bankruptcy', { t: 'bankrupt' }, 'danger');
    if (me.money < 0) { const n = document.createElement('div'); n.style.cssText = 'width:100%;font-size:calc(var(--u)*1.8)'; n.textContent = 'You are in debt. Mortgage or sell houses, or declare bankruptcy.'; acts.appendChild(n); }
  } else if (!g.winner && !me.bankrupt && me.money < 0) {
    add('Declare bankruptcy', { t: 'bankrupt' }, 'danger');
  }
  const cn = $('cardnote');
  const last = g.log.filter((l) => / draws /.test(l)).slice(-1)[0];
  if (g.lastCard && g.log.slice(-4).some((l) => l === last)) { cn.classList.remove('hidden'); cn.innerHTML = `<b>${g.lastCard.kind === 'chance' ? 'Chance' : 'Community Chest'}</b>: ${esc(g.lastCard.text)}`; }
  else cn.classList.add('hidden');
}

/* ---------- Side panel ---------- */
function renderPlayers() {
  $('players').innerHTML = S.players.map((p) => `<div class="pl ${S.g.turn === p.id && !S.g.winner ? 'turn' : ''} ${p.bankrupt ? 'out' : ''}">
    <span class="dot" style="background:${p.color}"></span>
    <span class="nm">${esc(p.name)}${p.id === ME ? '<span class="tag">you</span>' : ''}${p.inJail ? '<span class="tag">jail</span>' : ''}${p.online ? '' : '<span class="tag">offline</span>'}</span>
    <span class="mn" style="color:${p.money < 0 ? 'var(--bad)' : 'inherit'}">${money(p.money)}</span></div>`).join('');
}
function myPropList(id) { const out = []; S.g.props.forEach((p, i) => { if (p && p.owner === id) out.push(i); }); return out; }
function renderMyProps() {
  const list = myPropList(ME); const g = S.g; const box = $('myprops');
  if (!list.length) { box.innerHTML = '<div class="fair">You do not own any property yet.</div>'; return; }
  const grpOf = (i) => BOARD.map((s, j) => (s.group === BOARD[i].group ? j : -1)).filter((j) => j >= 0);
  box.innerHTML = list.map((i) => {
    const sq = BOARD[i]; const pr = g.props[i];
    let btns = '';
    if (sq.type === 'city') {
      const own = grpOf(i).every((j) => g.props[j].owner === ME);
      if (own && !pr.mort && g.turn === ME) btns += `<button data-a="build" data-i="${i}">+ ${money(sq.houseCost)}</button>`;
      if (pr.houses > 0) btns += `<button data-a="sell" data-i="${i}">sell</button>`;
    }
    if (!pr.mort && pr.houses === 0) btns += `<button data-a="mortgage" data-i="${i}">mortgage</button>`;
    if (pr.mort) btns += `<button data-a="unmortgage" data-i="${i}">unmortgage</button>`;
    const sw = sq.group ? GCOL[sq.group] : '#888';
    const info = sq.type === 'city' ? `${esc(sq.group)} &middot; ${pr.houses === 5 ? 'hotel' : pr.houses + ' houses'}` : sq.type === 'air' ? 'Airport' : 'Utility';
    return `<div class="prop"><span class="sw" style="background:${sw}"></span><span class="pn">${esc(sq.name)}${pr.mort ? ' <small>(mortgaged)</small>' : ''}<br><small>${info}</small></span>${btns}</div>`;
  }).join('');
  box.querySelectorAll('button[data-a]').forEach((b) => { b.onclick = () => send({ t: b.dataset.a, idx: Number(b.dataset.i) }); });
}
function renderLog() {
  const box = $('logbox'); const g = S.g;
  $('chatRow').classList.toggle('hidden', tab !== 'ch');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  if (tab === 'rl') {
    const dice = g.rolls.filter((r) => r.kind === 'dice');
    const exp = dice.length ? ((dice.length / 6) ).toFixed(1) : '0';
    box.innerHTML = `<div class="fair">Every roll comes from <b>crypto.randomInt</b> on the server, the same generator used for security keys. Nobody can see or influence the result before it happens.<br>Rolls so far: <b>${g.stats.total}</b> &middot; doubles: <b>${g.stats.doubles}</b> (${g.stats.total ? Math.round(g.stats.doubles / g.stats.total * 100) : 0}%, a fair game tends towards 17%)</div>` +
      '<table><tr><th>#</th><th>Player</th><th>Dice</th><th>Sum</th></tr>' +
      g.rolls.slice().reverse().filter((r) => r.kind === 'dice').slice(0, 150).map((r) => `<tr><td>${r.n}</td><td>${esc(r.player)}</td><td>${r.a} + ${r.b}${r.a === r.b ? ' &#127922;' : ''}</td><td>${r.a + r.b}</td></tr>`).join('') + '</table>';
  } else {
    const lines = g.log.filter((l) => tab === 'ch' ? l.startsWith('\u{1F4AC}') : true);
    box.innerHTML = lines.map((l) => `<div>${esc(l)}</div>`).join('');
  }
  if (atBottom || tab !== 'rl') box.scrollTop = tab === 'rl' ? 0 : box.scrollHeight;
}
document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); if (S && S.g) renderLog(); }; });
$('chatBtn').onclick = sendChat; $('chatIn').onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };
function sendChat() { const v = $('chatIn').value.trim(); if (v) send({ t: 'chat', text: v }); $('chatIn').value = ''; }

/* ---------- Trade modal ---------- */
function propChecks(owner, name) {
  const list = myPropList(owner).filter((i) => !(BOARD[i].type === 'city' && BOARD.some((s, j) => s.group === BOARD[i].group && S.g.props[j].houses > 0)));
  if (!list.length) return '<div class="fair">Nothing tradable</div>';
  return list.map((i) => `<label class="chk"><input type="checkbox" name="${name}" value="${i}"> ${esc(BOARD[i].name)}</label>`).join('');
}
function openTradeForm() {
  const others = S.players.filter((p) => p.id !== ME && !p.bankrupt);
  if (!others.length) return;
  const m = $('modal'); m.classList.remove('hidden'); modalKey = 'form';
  m.innerHTML = `<div class="card"><h1 style="font-size:22px">Propose a trade</h1><div class="sub">Both sides must agree.</div>
    <select id="tTo">${others.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <div class="cols" style="margin-top:12px"><div><b>You give</b><input id="tGM" type="number" min="0" placeholder="Cash $" style="margin:6px 0"><div id="tGP">${propChecks(ME, 'gp')}</div></div>
    <div><b>You get</b><input id="tTM" type="number" min="0" placeholder="Cash $" style="margin:6px 0"><div id="tTP"></div></div></div>
    <div class="row"><button class="primary" id="tSend" style="flex:1">Send offer</button><button id="tX">Close</button></div></div>`;
  const fill = () => { $('tTP').innerHTML = propChecks(Number($('tTo').value), 'tp'); };
  $('tTo').onchange = fill; fill();
  $('tX').onclick = () => { m.classList.add('hidden'); modalKey = ''; };
  $('tSend').onclick = () => {
    send({ t: 'trade', to: Number($('tTo').value), giveMoney: $('tGM').value, getMoney: $('tTM').value,
      giveProps: [...m.querySelectorAll('input[name=gp]:checked')].map((x) => x.value), getProps: [...m.querySelectorAll('input[name=tp]:checked')].map((x) => x.value) });
    m.classList.add('hidden'); modalKey = '';
  };
}
$('tradeBtn').onclick = () => openTradeForm();
function renderTradeModal() {
  const t = S.g.trade; const m = $('modal');
  if (!t) { if (modalKey.startsWith('trade')) { m.classList.add('hidden'); modalKey = ''; } return; }
  if (t.from !== ME && t.to !== ME) { if (modalKey.startsWith('trade')) { m.classList.add('hidden'); modalKey = ''; } return; }
  const key = 'trade' + t.id + (t.from === ME ? 'a' : 'b');
  if (modalKey === key) return;
  modalKey = key; m.classList.remove('hidden');
  const a = P(t.from), b = P(t.to);
  const desc = (side) => [side.money ? money(side.money) : '', ...side.props.map((i) => esc(BOARD[i].name))].filter(Boolean).join(', ') || 'nothing';
  if (t.to === ME) {
    m.innerHTML = `<div class="card"><h1 style="font-size:22px">Trade offer from ${esc(a.name)}</h1><div class="sub">&nbsp;</div>
      <p><b>You receive:</b> ${desc(t.give)}</p><p><b>You give:</b> ${desc(t.get)}</p>
      <div class="row"><button class="primary" id="tY" style="flex:1">Accept</button><button class="danger" id="tN" style="flex:1">Decline</button></div></div>`;
    $('tY').onclick = () => send({ t: 'tradeAnswer', accept: true });
    $('tN').onclick = () => send({ t: 'tradeAnswer', accept: false });
  } else {
    m.innerHTML = `<div class="card"><h1 style="font-size:22px">Waiting for ${esc(b.name)}</h1><div class="sub">&nbsp;</div>
      <p><b>You give:</b> ${desc(t.give)}</p><p><b>You get:</b> ${desc(t.get)}</p>
      <div class="row"><button id="tC" style="flex:1">Cancel offer</button></div></div>`;
    $('tC').onclick = () => send({ t: 'tradeCancel' });
  }
}

/* ---------- Render ---------- */
function show(id) { ['home', 'lobby', 'game'].forEach((x) => $(x).classList.toggle('hidden', x !== id)); }
function render() {
  if (!S) { show('home'); return; }
  if (!S.started) {
    show('lobby');
    $('lobbyCode').textContent = S.code;
    $('linkIn').value = location.origin + location.pathname + '?room=' + S.code;
    $('lobbyPlayers').innerHTML = S.players.map((p) => `<div><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.id === S.host ? '<span class="tag">host</span>' : ''}${p.id === ME ? '<span class="tag">you</span>' : ''}</div>`).join('');
    $('startBtn').disabled = !(S.host === ME && S.players.length >= 2);
    $('startBtn').textContent = S.host === ME ? (S.players.length >= 2 ? 'Start game' : 'Waiting for players...') : 'Waiting for the host...';
    return;
  }
  if (!BOARD) return;
  show('game');
  if (!boardBuilt) buildBoard();
  sizeBoard();
  updateBoard(); renderPlayers(); renderMyProps(); renderLog(); renderTradeModal();
}
connect();
</script>
</body>
</html>
